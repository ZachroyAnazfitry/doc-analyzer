name: CI/CD

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-5

jobs:
  ci:
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: |
          pip install ruff
          ruff check app/ tests/ --output-format=github

      - name: Test
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build -t doc-analyzer:ci .

  cd:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME || 'doc-analyzer' }}
          IMAGE_TAG: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker build --build-arg VERSION=$VERSION -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER || 'doc-analyzer-cluster' }} \
            --service ${{ vars.ECS_SERVICE || 'doc-analyzer-service' }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
